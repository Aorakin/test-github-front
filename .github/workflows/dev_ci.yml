name: Publish Docker image

on:
  push:
    branches:
      - dev

jobs:
  push_to_registry:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Extract Git commit SHA
        id: vars
        run: echo "sha_commitID=$(git rev-parse dev)" >> "$GITHUB_OUTPUT"

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: aorakin/test-node-js
          tags: |
            ${{ steps.vars.outputs.sha_commitID }}
      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
    outputs:
      image_tag: ${{ steps.vars.outputs.IMAGE_TAG }}
      
  trigger_cd_pipeline:
    name: Trigger CD Pipeline
    needs: push_to_registry
    runs-on: self-hosted
    steps:
        - name: Set up SSH
          run: |
            mkdir -p ~/.ssh
            echo "${{ secrets.SSH_SECRET }}" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            ssh-keyscan github.com >> ~/.ssh/known_hosts

        - name: Clone repository
          run: |
            git clone git@github.com:Aorakin/test-github-cd.git
            cd ./test-github-cd.git/

        - name: Set up Git
          run: |
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

        - name: Replace .dev.env with new image tag
          run: |
            echo "IMAGE=${{ secrets.DOCKER_USERNAME }}/test-node-js:${{ needs.push_to_registry.outputs.image_tag }}" > ./test-github-front/dev/.dev.env

        - name: Commit and Push
          run: |
            git add ./test-github-front/dev
            git commit -m "Trigger CD from Repo CI"
            git push